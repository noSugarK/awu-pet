[package]
name = "awu-pet"
version = "0.3.0"
description = "Awu Pet 嗷呜桌宠 · 一二、布布 Designed by 黄小B · Powered by noSugarK"
authors = ["noSugarK"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
user-idle = "0.6"

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
winreg = "0.56"
