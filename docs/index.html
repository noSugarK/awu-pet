<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一二 & 布布</title>
<meta name="author" content="形象设计：黄小B · powered by nosugark">
<meta name="description" content="用鼠标和一二、布布互动。形象设计：黄小B，powered by nosugark。">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root { --ink: #3a2317; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: radial-gradient(circle at 25% 15%, #fff7ec, #fde8e4 45%, #e6e3f7);
  font-family: "ZCOOL KuaiLe", system-ui, sans-serif; color: var(--ink);
  user-select: none; -webkit-user-select: none; touch-action: none;
}
h1 { position: fixed; top: 16px; left: 24px; margin: 0; font-weight: normal; font-size: clamp(28px, 5vw, 48px); letter-spacing: 2px; pointer-events: none; }
h1 small { display: block; font-size: .36em; opacity: .55; letter-spacing: 1px; }
footer { position: fixed; bottom: 16px; left: 0; right: 0; padding: 0 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; pointer-events: auto; }
.actions .label { font-size: 13px; opacity: .5; }
.actions button[aria-pressed="true"] { background: #fff; border-color: rgba(58,35,23,.5); }
.credit { margin: 0; font-size: 12px; opacity: .45; }
.credit a { color: inherit; }
.actions button { font: inherit; font-size: 16px; color: var(--ink); background: rgba(255,255,255,.7); border: 2px solid rgba(58,35,23,.15); border-radius: 999px; padding: 6px 14px; white-space: nowrap; cursor: pointer; transition: transform .15s, background .15s; }
.actions button:hover { background: #fff; transform: translateY(-2px); }
.actions button:active { transform: scale(.95); }
.hint { margin: 0; text-align: center; font-size: clamp(12px, 2.4vw, 16px); opacity: .6; pointer-events: none; }

.bear { position: absolute; width: min(34vw, 220px); aspect-ratio: 200 / 230; cursor: grab; outline: none; }
.bear.dragging { cursor: grabbing; z-index: 10; }
.shadow { position: absolute; left: 24%; right: 24%; bottom: 1%; height: 7%; border-radius: 50%; background: rgba(74,44,32,.14); }
.inner { position: absolute; inset: 0; transform-origin: 50% 95%; animation: breathe 3s ease-in-out infinite; }
.inner svg { width: 100%; height: 100%; display: block; overflow: visible; transform-origin: 50% 95%; }

@keyframes breathe { 50% { transform: scale(1.02, .975); } }
@keyframes jump {
  0% { transform: scale(1.12, .85); }
  30% { transform: translateY(-38%) scale(.92, 1.1); }
  62% { transform: translateY(0) scale(1.12, .86); }
  80% { transform: scale(.97, 1.04); }
}
@keyframes shadowJump { 30% { transform: scale(.55); opacity: .5; } }
@keyframes shake { 25% { transform: translateX(-2%) rotate(-2deg); } 75% { transform: translateX(2%) rotate(2deg); } }
@keyframes bob { from { transform: translateY(0) scale(1.03, .97); } to { transform: translateY(-5%) scale(.98, 1.02); } }
@keyframes step { from { transform: translateY(0); } to { transform: translateY(-8px); } }
@keyframes swing { from { transform: rotate(calc(var(--rest) - 24deg)); } to { transform: rotate(calc(var(--rest) + 24deg)); } }
@keyframes ponder { 50% { transform: rotate(-3deg) scale(1.01, .99); } }
@keyframes dance { from { transform: rotate(-7deg); } 50% { transform: translateY(-6%) scale(.98, 1.03); } to { transform: rotate(7deg); } }
@keyframes wave { from { transform: rotate(125deg); } to { transform: rotate(160deg); } }
@keyframes chop { to { transform: rotate(-10deg); } }
@keyframes sip { to { transform: translateY(-4px); } }
@keyframes fidget { from { transform: rotate(-44deg); } to { transform: rotate(-60deg); } }

.running .inner { animation: bob .16s ease-in-out infinite alternate; }
.s-angry .inner { animation: shake .12s linear infinite; }
.s-sleep .inner { animation: breathe 4.5s ease-in-out infinite; transform-origin: 50% 100%; }
.inner.jump { animation: jump .7s ease-out; }
.jumping .shadow { animation: shadowJump .7s ease-out; }

/* SVG parts; each .arm rotates about its shoulder (local 0 0). Angles: positive = outward, same for both sides */
#yier { --rest: 40deg; } /* yier's shoulder sits on the body edge, so the nub sticks out sideways */
.cap { display: none; }
#yier .cap { display: inline; } /* closes the outline where yier's arm leaves the body */
#bubu { --rest: -32deg; } /* bubu keeps his curled paws in front of the belly */
.arm { transform-box: view-box; transform-origin: 0 0; transform: rotate(var(--rest)); transition: transform .3s; }
.leg { transform-box: view-box; transition: transform .3s; }
.leg-l { transform-origin: 80px 200px; }
.leg-r { transform-origin: 120px 200px; }
.running .leg-l { animation: step .32s ease-in-out infinite alternate; }
.running .leg-r { animation: step .32s ease-in-out infinite alternate-reverse; }
.running .arm-l { animation: swing .32s ease-in-out infinite alternate-reverse; }
.running .arm-r { animation: swing .32s ease-in-out infinite alternate; }
.wave .arm-r { animation: wave .25s ease-in-out 6 alternate; }
.s-hug .arm { transform: rotate(75deg); }
/* the arm's inner edge is only half-outlined (a short crease) unless the arm is raised away from the body */
.edge { display: none; }
.s-hug .edge, .s-dance .edge, .wave .arm-r .edge { display: inline; }
/* thinking / shy: both paws folded in front */
.s-think .arm { transform: rotate(-48deg); }
.s-shy .arm { animation: fidget .4s ease-in-out infinite alternate; }
.s-shy .arm-r { animation-direction: alternate-reverse; }
.s-think .inner { animation: ponder 2s ease-in-out infinite; }
.s-shy .inner { animation: ponder 1.2s ease-in-out infinite; }
.s-shy .blush { transform: scale(1.45); opacity: 1; }
/* dancing: bounce + sway, inner arm holds the partner's hand, outer arm swings */
.s-dance .inner { animation: dance .5s ease-in-out infinite alternate; }
.s-dance .leg-l { animation: step .5s ease-in-out infinite alternate; }
.s-dance .leg-r { animation: step .5s ease-in-out infinite alternate-reverse; }
.s-dance.hold-r .arm-r, .s-dance.hold-l .arm-l { transform: rotate(85deg); }
.s-dance.hold-r .arm-l, .s-dance.hold-l .arm-r { animation: swing .5s ease-in-out infinite alternate; }
/* props held in front (noodles, boba, rose) and outfits worn on top (sunglasses, scarf) */
.prop { display: none; }
.s-noodle .p-noodle, .s-boba .p-boba, .s-rose .p-rose, .o-glasses .p-glasses, .o-scarf .p-scarf { display: inline; }
.s-noodle .arm, .s-boba .arm, .s-rose .arm { transform: rotate(-48deg); }
.running.s-rose .arm { animation: none; }
.chop { transform-box: view-box; transform-origin: 130px 197px; animation: chop .45s ease-in-out infinite alternate; }
.p-boba { animation: sip 1.2s ease-in-out infinite alternate; }
/* sleeping: lie down on the belly, head on the ground, paws under the chin */
.bodyparts, .headpos { transition: opacity .4s, transform .6s ease-in-out; }
.s-sleep .bodyparts { opacity: 0; }
.s-sleep .headpos { transform: translateY(62px); }
.s-sleep .arm { transition: transform .6s ease-in-out; transform: translate(14px, 58px) rotate(-78deg); }
#yier.s-sleep .arm { transform: translate(21px, 56px) rotate(-78deg); }
.blush { transform-box: fill-box; transform-origin: center; transition: transform .3s, opacity .3s; opacity: .9; }
.bear:hover .blush, .s-hug .blush { transform: scale(1.25); opacity: 1; }

.eyes-happy, .eyes-closed, .m-open, .m-smile, .m-frown, .brows, .tears { display: none; }
.s-happy .eyes-open, .s-hug .eyes-open, .s-dance .eyes-open, .s-noodle .eyes-open, .s-rose .eyes-open, .s-sleep .eyes-open, .s-shy .eyes-open { display: none; }
.s-happy .eyes-happy, .s-hug .eyes-happy, .s-dance .eyes-happy, .s-noodle .eyes-happy, .s-rose .eyes-happy { display: inline; }
.s-sleep .eyes-closed, .s-shy .eyes-closed { display: inline; }
.s-happy .m-normal, .s-hug .m-normal, .s-dance .m-normal, .s-surprised .m-normal, .s-angry .m-normal, .s-sad .m-normal { display: none; }
.s-happy .m-smile, .s-hug .m-smile, .s-dance .m-smile { display: inline; }
.s-surprised .m-open { display: inline; }
.s-angry .m-frown, .s-sad .m-frown, .s-angry .brows, .s-sad .tears { display: inline; }
.tears path { animation: tear 1s ease-in infinite; }
.tears path:last-child { animation-delay: .5s; }
@keyframes tear { from { transform: translateY(0); opacity: 1; } to { transform: translateY(22px); opacity: 0; } }

.particle { position: fixed; z-index: 20; pointer-events: none; transform: translate(-50%, -50%); animation: fly 1s ease-out forwards; }
@keyframes fly { to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.4) rotate(40deg); opacity: 0; } }
.spark { position: fixed; z-index: 5; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); animation: spark .7s ease-out forwards; }
@keyframes spark { to { transform: translate(-50%, 0) scale(0); opacity: 0; } }
.puff { position: fixed; z-index: 1; width: 16px; height: 16px; border-radius: 50%; pointer-events: none; background: rgba(150,125,110,.3); transform: translate(-50%, -50%); animation: puff .55s ease-out forwards; }
@keyframes puff { to { transform: translate(calc(-50% + var(--dx)), -120%) scale(2.2); opacity: 0; } }

@media (prefers-reduced-motion: reduce) { .inner, .spark, .leg, .arm { animation: none !important; } }
</style>
</head>
<body>
<h1>一二 &amp; 布布<small>常想一二，不思八九</small></h1>
<div class="bear" id="yier" role="button" tabindex="0" aria-label="一二"><div class="shadow"></div><div class="inner"></div></div>
<div class="bear" id="bubu" role="button" tabindex="0" aria-label="布布"><div class="shadow"></div><div class="inner"></div></div>
<footer>
<div class="actions"><span class="label">动作</span><button id="think">💭 思考</button><button id="dance">🎵 跳舞</button><button id="shy">😊 害羞</button><button id="sleep">💤 睡觉</button></div>
<div class="actions"><span class="label">道具</span><button id="noodle">🍜 吃面</button><button id="boba">🧋 奶茶</button><button id="rose">🌹 送花</button><span class="label">搭配</span><button id="glasses" aria-pressed="false">🕶️ 墨镜</button><button id="scarf" aria-pressed="false">🧣 围巾</button></div>
<p class="hint">👀 移动鼠标 · 👆 点击 · 😤 连点 · ✋ 拖着跑 · 💞 拖到一起 · 🏃 双击空白处 · 🍜🧋🌹 下方按钮 · 😴 静止一会儿</p>
<p class="credit">形象设计：黄小B · powered by nosugark · 形象版权归原作者所有，本站为非商业粉丝作品</p></footer>

<script>
const INK = '#3a2317';
const LOOKS = {
  yier: { body: '#fffdf8', ear: '#5b3524', earIn: null, blush: '#f9a9a0', bow: true, shoulder: [55, 159], tongue: true, fx: ['♥', '♡'], fxColor: '#ff6b8a' },
  bubu: { body: '#c9895a', ear: '#b87644', earIn: '#6f3f25', blush: '#f7aa3c', bow: false, shoulder: [62, 157], tongue: false, fx: ['★', '✦'], fxColor: '#f5b400' },
};

// traced from design/reference/* and github.com/littlegqqq/Yier-Bubu sprites: mochi head, round pear body,
// one rounded arm per side that grows out of the shoulder (only its outer edge + tip are outlined, so it never looks detached)
function bearSVG(c, id) {
  const HEAD = 'M100 22 C150 22 181 50 184 98 C186 132 160 152 100 152 C40 152 14 132 16 98 C19 50 50 22 100 22 Z';
  const eye = x => `<ellipse cx="${x}" cy="103" rx="6" ry="7" fill="${INK}" stroke="none"/><circle cx="${x - 2}" cy="100.5" r="1.7" fill="#fff" stroke="none"/>`;
  const ear = (x, ix) => `<circle cx="${x}" cy="44" r="21" fill="${c.ear}"/>` + (c.earIn ? `<circle cx="${ix}" cy="41" r="11" fill="${c.earIn}" stroke="none"/>` : '');
  const mouth = c.tongue
    ? `<path class="m-normal" fill="#f28b82" stroke-width="2.5" d="M93 110 Q96.5 113 100 110 Q103.5 113 107 110 Q106 121 100 121 Q94 121 93 110 Z"/>`
    : `<path class="m-normal" fill="none" stroke-width="2.5" d="M93 111 Q96.5 116 100 111 Q103.5 116 107 111"/>`;
  // arm in shoulder-local coords, pointing down; CSS rotates it (positive = outward, the right arm is a mirror)
  const arm = side => `<g transform="translate(${c.shoulder})"><g class="arm arm-${side}">
      <path fill="${c.body}" stroke="none" d="M-10 0 A10 10 0 0 1 10 0 L10 16 A10 10 0 0 1 -10 16 Z"/>
      <path fill="none" d="M-10 0 L-10 16 A10 10 0 0 0 10 16 L10 8"/><path class="cap" fill="none" d="M-5 -8.66 A10 10 0 0 0 -10 0"/><path class="edge" fill="none" d="M10 8 L10 0"/></g></g>`;
  return `<svg viewBox="0 0 200 230" stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
   <g class="bodyparts">
    <g class="leg leg-l"><path fill="${c.body}" d="M50 204 C48 214 56 223 74 223 C90 223 99 220 99 210 L99 192 L56 192 Z"/></g>
    <g class="leg leg-r"><path fill="${c.body}" d="M150 204 C152 214 144 223 126 223 C110 223 101 220 101 210 L101 192 L144 192 Z"/></g>
    <path fill="${c.body}" stroke="none" d="M66 128 C46 150 40 186 50 204 C56 212 144 212 150 204 C160 186 154 150 134 128 Z"/>
    <path fill="none" d="M66 128 C46 150 40 186 50 204 M134 128 C154 150 160 186 150 204"/>
    ${c.bow ? `<path fill="#6b3a26" stroke-width="2.5" d="M58 142 Q100 160 142 142 L142 147 Q100 164 58 147 Z"/>` : ''}
    <g class="prop p-scarf" fill="#e0473f">
      <path d="M52 136 Q100 162 148 136 L150 151 Q100 178 50 151 Z"/>
      <path d="M116 158 L122 198 L140 194 L132 154 Z"/>
      <path fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2" d="M58 146 Q100 167 142 146 M124 190 L138 187"/>
    </g>
   </g>
   <g class="headpos"><g class="head">
      ${ear(42, 38)}${ear(158, 162)}
      <clipPath id="clip-${id}"><path d="${HEAD}"/></clipPath>
      <path fill="${c.body}" d="${HEAD}"/>
      <g clip-path="url(#clip-${id})"><g class="face">
        <circle class="blush" cx="51" cy="123" r="13" fill="${c.blush}" stroke="none"/>
        <circle class="blush" cx="149" cy="123" r="13" fill="${c.blush}" stroke="none"/>
        <g class="eyes-open">${eye(66)}${eye(134)}</g>
        <g class="eyes-happy" fill="none"><path d="M59 108 L70 102 L59 96"/><path d="M141 108 L130 102 L141 96"/></g>
        <g class="eyes-closed" fill="none"><path d="M58 103 Q66 109 74 103"/><path d="M126 103 Q134 109 142 103"/></g>
        <g class="brows"><path d="M55 89 L75 95"/><path d="M145 89 L125 95"/></g>
        <g class="tears" fill="#8fd3ff" stroke="none"><path d="M64 112 q-5 9 0 13 q5 -4 0 -13z"/><path d="M136 112 q-5 9 0 13 q5 -4 0 -13z"/></g>
        <g class="prop p-glasses" fill="#2b2b33">
          <rect x="49" y="92" width="34" height="21" rx="9"/><rect x="117" y="92" width="34" height="21" rx="9"/>
          <path fill="none" d="M83 99 Q100 93 117 99"/>
          <path fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.5" d="M56 98 L63 98 M124 98 L131 98"/>
        </g>
        ${mouth}
        <path class="m-smile" fill="#f28b82" stroke-width="2.5" d="M90 109 Q95 113 100 109 Q105 113 110 109 Q109 126 100 126 Q91 126 90 109 Z"/>
        <ellipse class="m-open" cx="100" cy="117" rx="5" ry="6.5" fill="#e0685e" stroke-width="2.5"/>
        <path class="m-frown" fill="none" stroke-width="2.5" d="M94 118 Q100 112 106 118"/>
      </g></g>
      <path fill="none" d="${HEAD}"/>
   </g></g>
   ${c.bow ? `<g class="bodyparts" fill="#6b3a26" stroke-width="2.5">
      <path d="M100 158 C93 148 80 146 80 158 C80 170 93 168 100 158 Z"/><path d="M100 158 C107 148 120 146 120 158 C120 170 107 168 100 158 Z"/>
      <path fill="none" stroke-width="1.6" d="M86 153 Q90 158 86 163 M114 153 Q110 158 114 163"/>
      <ellipse cx="100" cy="158" rx="5.5" ry="6"/></g>` : ''}
   ${arm('l')}
   <g transform="translate(200 0) scale(-1 1)">${arm('r')}</g>
   <g class="prop p-noodle">
      <path fill="none" stroke="#f3c969" stroke-width="3" d="M98 180 C94 162 104 146 100 124"/>
      <g class="chop" stroke="#9a6334" stroke-width="3"><path d="M128 198 L106 126"/><path d="M134 196 L112 126"/></g>
      <path fill="#fffaf2" d="M64 178 L136 178 Q132 210 100 210 Q68 210 64 178 Z"/>
      <path fill="none" stroke="#e0473f" stroke-width="3" d="M69 188 Q100 197 131 188"/>
   </g>
   <g class="prop p-boba">
      <path stroke="#e0685e" stroke-width="4" d="M104 162 L110 118"/>
      <path fill="#f1dcc0" d="M84 164 L116 164 L112 206 L88 206 Z"/>
      <g fill="${INK}" stroke="none"><circle cx="93" cy="200" r="3"/><circle cx="100" cy="201" r="3"/><circle cx="107" cy="199" r="3"/><circle cx="97" cy="194" r="3"/><circle cx="104" cy="193" r="3"/></g>
      <rect x="81" y="158" width="38" height="7" rx="3" fill="#fff"/>
   </g>
   <g class="prop p-rose">
      <path fill="none" stroke="#4f9a4a" stroke-width="3.5" d="M110 204 Q115 178 120 152"/>
      <path fill="#6cc167" stroke-width="2.5" d="M115 182 Q127 172 132 179 Q124 188 115 182 Z"/>
      <circle cx="121" cy="143" r="12" fill="#e0473f"/>
      <path fill="none" stroke-width="2" d="M115 141 Q121 134 127 141 Q121 149 115 141"/>
   </g>
  </svg>`;
}

const bears = ['yier', 'bubu'].map(id => {
  const el = document.getElementById(id), inner = el.querySelector('.inner');
  inner.innerHTML = bearSVG(LOOKS[id], id);
  return { id, el, inner, svg: inner.querySelector('svg'), look: LOOKS[id], head: el.querySelector('.head'), face: el.querySelector('.face'),
    state: 'normal', timer: 0, x: 0, y: 0, goal: null, dir: 0, runUntil: 0, lastPuff: 0, lastFx: 0, fx: 0, fy: 0, tilt: 0, lean: 0, clicks: [] };
});
const other = b => bears[b === bears[0] ? 1 : 0];
const rect = b => b.el.getBoundingClientRect();
const center = b => { const r = rect(b); return { x: r.left + r.width / 2, y: r.top + r.height * .43 }; };
const clamp = (v, a, z) => Math.max(a, Math.min(z, v));
const apart = () => { const a = center(bears[0]), b = center(bears[1]); return Math.hypot(a.x - b.x, a.y - b.y) > innerWidth * .6; };
const baseState = () => apart() ? 'sad' : 'normal';

function setState(b, s, ms) {
  b.el.classList.remove('s-' + b.state);
  b.state = s;
  b.el.classList.add('s-' + s);
  clearTimeout(b.timer);
  if (ms) b.timer = setTimeout(() => setState(b, baseState()), ms);
}
const refresh = () => bears.forEach(b => { if (b.state === 'normal' || b.state === 'sad') setState(b, baseState()); });

// --- movement: bears never teleport, they run to a goal at a fixed speed ---
function setPos(b, x, y) {
  const r = rect(b);
  b.x = clamp(x, 0, innerWidth - r.width);
  b.y = clamp(y, 0, innerHeight - r.height);
  b.el.style.left = b.x + 'px';
  b.el.style.top = b.y + 'px';
}
function moveTo(b, x, y, speed = 320) {
  const r = rect(b);
  b.goal = { x: clamp(x, 0, innerWidth - r.width), y: clamp(y, 0, innerHeight - r.height), speed };
  return new Promise(res => { b.goal.done = res; }); // a newer moveTo replaces the goal, so the old promise just never resolves
}

function burst(x, y, chars, color, n = 8, spread = 1.2) {
  for (let i = 0; i < n; i++) {
    const p = document.createElement('span'), a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * spread, d = 60 + Math.random() * 80;
    p.className = 'particle';
    p.textContent = chars[i % chars.length];
    p.style.cssText = `left:${x}px;top:${y}px;color:${color};font-size:${14 + Math.random() * 16}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`;
    p.onanimationend = () => p.remove();
    document.body.append(p);
  }
}
function puff(b) {
  const r = rect(b), p = document.createElement('span');
  p.className = 'puff';
  p.style.cssText = `left:${r.left + r.width / 2 - b.dir * r.width * .3}px;top:${r.bottom - r.height * .05}px;--dx:${-b.dir * 20}px`;
  p.onanimationend = () => p.remove();
  document.body.append(p);
}

function jump(b) {
  b.inner.classList.remove('jump');
  void b.inner.offsetWidth; // restart animation
  b.inner.classList.add('jump');
  b.el.classList.add('jumping');
}
bears.forEach(b => b.inner.addEventListener('animationend', e => {
  if (e.animationName === 'jump') { b.inner.classList.remove('jump'); b.el.classList.remove('jumping'); }
}));

function poke(b) {
  const now = Date.now(), c = center(b);
  b.clicks = b.clicks.filter(t => now - t < 1500).concat(now);
  if (b.clicks.length >= 5) {
    setState(b, 'angry', 1800);
    burst(c.x + 40, c.y - 50, ['💢'], '#e33', 1, .1);
    return;
  }
  if (b.state === 'angry') return setState(b, 'angry', 1800);
  jump(b);
  setState(b, 'happy', 1200);
  burst(c.x, c.y - 30, b.look.fx, b.look.fxColor);
}

function hug(b, o) {
  const ro = rect(o), side = center(b).x < center(o).x ? -1 : 1;
  setState(b, 'happy');
  moveTo(b, ro.left + side * ro.width * .68, ro.top, 360).then(() => {
    [b, o].forEach(x => setState(x, 'hug', 2600));
    const a = center(b), c = center(o);
    burst((a.x + c.x) / 2, Math.min(a.y, c.y) - 40, ['♥', '♡', '💕'], '#ff6b8a', 14, 1.6);
  });
}

// --- dragging: the bear runs after the pointer instead of snapping to it ---
let drag = null;
bears.forEach(b => {
  b.el.addEventListener('pointerdown', e => {
    e.preventDefault();
    b.el.setPointerCapture(e.pointerId);
    const r = rect(b);
    drag = { b, ox: e.clientX - r.left, oy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, moved: false };
  });
  b.el.addEventListener('pointermove', e => {
    if (drag?.b !== b) return;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;
      drag.moved = true;
      b.el.classList.add('dragging');
    }
    moveTo(b, e.clientX - drag.ox, e.clientY - drag.oy, 650);
  });
  b.el.addEventListener('pointerup', () => {
    if (drag?.b !== b) return;
    const moved = drag.moved;
    drag = null;
    if (!moved) return poke(b);
    b.el.classList.remove('dragging');
    moveTo(b, b.goal?.x ?? b.x, b.goal?.y ?? b.y, 650).then(() => {
      const o = other(b), a = center(b), c = center(o);
      if (Math.hypot(a.x - c.x, a.y - c.y) < rect(b).width * 1.1) return hug(b, o);
      refresh();
    });
  });
  b.el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); poke(b); } });
});

// double-click empty space: both run over and wave
addEventListener('dblclick', e => {
  if (e.target.closest('.bear, button')) return;
  const w = rect(bears[0]).width, h = rect(bears[0]).height;
  bears.forEach((b, i) => {
    if (b.state === 'sleep') setState(b, 'normal');
    moveTo(b, e.clientX - w * (i ? .1 : .9), e.clientY - h * .7, i ? 300 : 340).then(() => {
      b.el.classList.add('wave');
      setState(b, 'happy', 1500);
      setTimeout(() => b.el.classList.remove('wave'), 1500);
    });
  });
});

document.getElementById('shy').onclick = () => bears.forEach(b => setState(b, 'shy', 3000));
document.getElementById('sleep').onclick = () => { manualSleep = true; bears.forEach(b => setState(b, 'sleep')); };
document.getElementById('noodle').onclick = () => bears.forEach(b => setState(b, 'noodle', 4000));
document.getElementById('boba').onclick = () => bears.forEach(b => setState(b, 'boba', 4000));
document.getElementById('rose').onclick = () => {
  // bubu runs over holding a rose, then yier gets it
  const [giver, recv] = bears[1].id === 'bubu' ? [bears[1], bears[0]] : bears;
  const r = rect(recv), side = center(giver).x < center(recv).x ? -1 : 1;
  setState(giver, 'rose');
  moveTo(giver, r.left + side * r.width * .75, r.top, 320).then(() => {
    setState(giver, 'happy', 2500);
    setState(recv, 'rose', 3500);
    jump(recv);
    const c = center(recv);
    burst(c.x, c.y - 40, ['♥', '♡', '💕'], '#ff6b8a', 12, 1.4);
  });
};
for (const id of ['glasses', 'scarf']) {
  const btn = document.getElementById(id);
  btn.onclick = () => {
    const on = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', on);
    bears.forEach(b => { b.el.classList.toggle('o-' + id, on); if (on) { jump(b); setState(b, 'happy', 1200); } });
  };
}
document.getElementById('think').onclick = () => bears.forEach(b => setState(b, 'think', 3500));
document.getElementById('dance').onclick = () => {
  // meet in the middle, then dance holding hands (left bear holds with its right arm)
  const [l, r] = [...bears].sort((a, b) => a.x - b.x), w = rect(l).width;
  const mid = (center(l).x + center(r).x) / 2, y = (l.y + r.y) / 2;
  Promise.all([moveTo(l, mid - w * .9, y), moveTo(r, mid - w * .1, y)]).then(() => {
    l.el.classList.add('hold-r'); l.el.classList.remove('hold-l');
    r.el.classList.add('hold-l'); r.el.classList.remove('hold-r');
    bears.forEach(b => setState(b, 'dance', 5000));
  });
};

// --- mouse tracking, trail, idle sleep ---
const mouse = { x: innerWidth / 2, y: innerHeight / 2 };
let lastActive = Date.now(), lastSpark = 0;
const SPARK_COLORS = ['#ffb3c6', '#ffd97a', '#b8e0ff', '#c9b8ff'];

// idle sleep ends on any mouse move; sleep from the button only ends on a click or key
let manualSleep = false;
function wake(force) {
  lastActive = Date.now();
  if (manualSleep && !force) return;
  manualSleep = false;
  bears.forEach(b => { if (b.state === 'sleep') setState(b, 'surprised', 900); });
}
addEventListener('pointerdown', () => wake(true));
addEventListener('keydown', () => wake(true));
addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  wake(false);
  if (e.timeStamp - lastSpark < 35) return;
  lastSpark = e.timeStamp;
  const s = document.createElement('span');
  s.className = 'spark';
  s.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;background:${SPARK_COLORS[Math.random() * 4 | 0]}`;
  s.onanimationend = () => s.remove();
  document.body.append(s);
});

setInterval(() => {
  if (Date.now() - lastActive > 12000) bears.forEach(b => { if (!b.goal && (b.state === 'normal' || b.state === 'sad')) setState(b, 'sleep'); });
  bears.forEach(b => {
    if (b.state !== 'sleep') return;
    const r = rect(b);
    burst(r.left + r.width * .75, r.top + r.height * .15, ['z', 'Z'], '#4a7fd6', 1, .3);
  });
}, 900);

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, .05);
  last = now;
  for (const b of bears) {
    if (b.goal) {
      const g = b.goal, dx = g.x - b.x, dy = g.y - b.y, d = Math.hypot(dx, dy), stepLen = g.speed * dt;
      if (d <= stepLen) { setPos(b, g.x, g.y); b.goal = null; g.done(); }
      else {
        setPos(b, b.x + dx / d * stepLen, b.y + dy / d * stepLen);
        if (Math.abs(dx) > 2) b.dir = Math.sign(dx);
        b.runUntil = now + 120; // hysteresis so tiny drag moves don't restart the run cycle
      }
    }
    const running = now < b.runUntil;
    b.el.classList.toggle('running', running);
    if (running && now - b.lastPuff > 140) { b.lastPuff = now; puff(b); }
    if (b.state === 'noodle' && now - b.lastFx > 500) {
      b.lastFx = now;
      const r = rect(b);
      burst(r.left + r.width * .5, r.top + r.height * .72, ['～'], '#b9aca3', 1, .3); // steam from the bowl
    }
    if ((b.state === 'think' && now - b.lastFx > 1100) || (b.state === 'dance' && now - b.lastFx > 350)) {
      b.lastFx = now;
      const r = rect(b), think = b.state === 'think';
      burst(r.left + r.width * (think ? .7 : Math.random()), r.top + r.height * (think ? .05 : .2), think ? ['?'] : ['♪', '♫', '♬'], '#4a7fd6', 1, think ? .2 : .8);
    }

    // face + head look at the pointer, the partner, or the running direction
    let tx = 0, ty = 0, tt = 0;
    if (running) { tx = b.dir * 20; ty = 3; tt = b.dir * 4; }
    else if (b.state === 'think') { tx = -7; ty = -7; tt = -8; }
    else if (b.state !== 'sleep') {
      const c = center(b);
      const t = ['hug', 'sad', 'dance', 'shy'].includes(b.state) ? center(other(b)) : mouse;
      const dx = t.x - c.x, dy = t.y - c.y, d = Math.hypot(dx, dy) || 1, k = Math.min(d / 80, 1) * 9;
      tx = dx / d * k; ty = dy / d * k * .7; tt = clamp(dx / 40, -10, 10);
    }
    b.fx += (tx - b.fx) * .15; b.fy += (ty - b.fy) * .15; b.tilt += (tt - b.tilt) * .1;
    b.lean += ((running ? b.dir * 8 : 0) - b.lean) * .15;
    b.face.setAttribute('transform', `translate(${b.fx} ${b.fy})`);
    b.head.setAttribute('transform', `rotate(${b.tilt} 100 150)`);
    b.svg.style.rotate = b.lean + 'deg';
  }
  requestAnimationFrame(loop);
}

function layout() {
  const r = rect(bears[0]);
  setPos(bears[0], innerWidth / 2 - r.width * 1.05, innerHeight / 2 - r.height / 2);
  setPos(bears[1], innerWidth / 2 + r.width * .05, innerHeight / 2 - r.height / 2);
}
layout();
addEventListener('resize', () => {
  // page may load in a hidden/zero-size viewport, which piles both bears in a corner
  if (bears[0].x === bears[1].x && bears[0].y === bears[1].y) return layout();
  bears.forEach(b => setPos(b, b.x, b.y));
});
bears.forEach(b => setState(b, 'normal'));
requestAnimationFrame(loop);
</script>
</body>
</html>
