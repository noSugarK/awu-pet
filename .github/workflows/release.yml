# Builds Awu Pet for Windows / macOS / Linux and publishes the installers to GitHub Releases.
# Trigger: push a tag like v0.1.0 (the tag must match "version" in desktop/src-tauri/tauri.conf.json).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libx11-dev libxss-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx --yes @tauri-apps/cli@^2
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Awu Pet ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          releaseBody: |
            **Awu Pet · 嗷呜桌宠**（原名 YierBubu-Pet）—— 住在任务栏上的桌宠：会陪你玩，还会帮你“嗷呜”一口吃掉文件。

            - 站在任务栏上，按性格自己散步、玩耍、打盹，离开电脑就睡觉；全屏打游戏 / 看视频时躲到角落
            - 把文件 / 文件夹拖到宠物身上：小文件直接移进系统回收站，大文件先确认；成功后随机吃掉或踢走，可以找回
            - Windows 资源管理器右键「请X删除」：宠物冲过去帮忙移入回收站（Win11 在「显示更多选项」里）
            - 右键宠物弹出圆盘菜单；「角色」里点击换成它，按住 Ctrl / Shift 点击添加或移除，最多 4 只同屏
            - 支持 Codex / Petdex 宠物包（帧动画），每只有自己的动作；默认两只一二布布，其他角色可在「角色」中下载或导入
            - 支持多显示器；滚轮调大小、开机自启、托盘菜单

            **下载**：Windows 选 `*-setup.exe`（或 `.msi`），macOS 选 `.dmg`，Linux 选 `.AppImage` / `.deb`。装过旧版 YierBubu-Pet 的话，Windows 安装包会先把旧版卸掉，设置和位置都保留。

            安装包暂未签名：Windows 若出现 SmartScreen 提示，点「更多信息 → 仍要运行」；macOS 若提示"已损坏"，在终端执行 `xattr -cr /Applications/Awu-Pet.app`。

            一二、布布 Designed by 黄小B · Powered by noSugarK
            一二、布布形象版权归原作者黄小B所有，其他角色版权归各自权利人；自带宠物包的精灵图版权归各自作者，仅供非商业使用。本软件为非商业粉丝作品。
